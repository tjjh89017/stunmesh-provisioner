name: 'Set Up Go'
description: 'Install the Go toolchain and enable its build cache.'

inputs:
  go-version:
    description: 'Go version to install; stable tracks the latest patched release'
    required: false
    default: 'stable'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
