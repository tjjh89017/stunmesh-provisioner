name: 'E2E OpenWrt'
description: >-
  Boot a real OpenWrt x86-64 VM under KVM and run the stunmesh-agent e2e
  harness against it. test/e2e/openwrt/run.sh is the source of truth for
  what the harness does; this action only prepares the host for it.

inputs:
  openwrt-version:
    description: >-
      OpenWrt release to build, for example 25.12.5. Leave empty to
      resolve the latest stable release automatically. Forwarded to
      run.sh as --openwrt-version.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # run.sh calls ensure_kvm_available itself, so this action needs no KVM step.

    # run.sh's own `need_cmd`/`need_cmd_root` checks name everything it
    # needs. qemu-system-x86, qemu-utils and zstd (unzstd) are not on the
    # stock runner image; wireguard-tools supplies `wg`, used to generate
    # fixture keys on the host. Everything else the harness needs (curl,
    # make, go, ssh, losetup, blkid, mount, sudo) already ships on
    # GitHub-hosted Ubuntu runners, so this installs nothing beyond the
    # four packages above it.
    - name: Install host packages the harness needs
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-system-x86 qemu-utils zstd wireguard-tools

    # TMPDIR is pointed at a workspace-relative directory instead of the
    # default /tmp so the diagnostics step below can find run.sh's work
    # directory by a stable glob. E2E_KEEP_WORK=1 stops run.sh's cleanup
    # trap from deleting it, on every exit path -- success or failure --
    # so the upload step always has something to look for.
    - name: Run the OpenWrt e2e harness
      shell: bash
      env:
        OPENWRT_VERSION: ${{ inputs.openwrt-version }}
        E2E_KEEP_WORK: '1'
        TMPDIR: ${{ github.workspace }}/.e2e-openwrt-work
      run: |
        set -euo pipefail
        mkdir -p "$TMPDIR"
        test/e2e/openwrt/run.sh

    # A failed boot's only evidence is the guest's serial console, so
    # boot.log is the one file this step cannot skip. The fake dhtproxy
    # logs are the next most likely place to find why a fetch failed.
    # The image itself, the built binaries and the SSH keypair are
    # deliberately left out: they are large, reproducible from this same
    # run, or (the private key) not something to publish as a build
    # artifact.
    - name: Upload e2e diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-openwrt-diagnostics
        path: |
          .e2e-openwrt-work/stunmesh-e2e-openwrt.*/boot.log
          .e2e-openwrt-work/stunmesh-e2e-openwrt.*/fakeproxy.log
          .e2e-openwrt-work/stunmesh-e2e-openwrt.*/fakeproxy-delayed.log
        if-no-files-found: warn
        retention-days: 7
