name: 'Build and Push Docker Container'
description: 'Build the stunmesh-provd image with buildx and, when asked, push it to ghcr.io.'

inputs:
  image:
    description: 'Fully qualified image name'
    required: false
    default: 'ghcr.io/tjjh89017/stunmesh-provd'
  version:
    description: 'Value passed to the Dockerfile VERSION build-arg (git describe is not reliable inside a build context, see the Dockerfile comment)'
    required: false
    default: 'dev'
  platforms:
    description: 'Target platforms for the buildx build'
    required: false
    default: 'linux/amd64,linux/arm64'
  push:
    description: 'Whether to push the built image'
    required: false
    default: 'true'
  ghcr-token:
    description: 'GitHub token with packages:write, used to log in to ghcr.io'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: docker/setup-qemu-action@v4

    - uses: docker/setup-buildx-action@v4

    # ghcr.io is the only registry. Skip the login when push is false.
    - uses: docker/login-action@v4
      if: inputs.push == 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.ghcr-token }}

    - uses: docker/metadata-action@v6
      id: meta
      with:
        images: ${{ inputs.image }}
        # metadata-action's default semver patterns strip the tag's "v"
        # prefix (its {{version}} is the bare semver core); these explicit
        # patterns put it back so every published container tag reads
        # "v1.2.3", matching the git tag it was built from. type=ref with
        # event=branch only fires on a branch push (main.yaml's merge-to-main
        # job), producing the literal tag "main"; it never fires for a tag
        # push, so it does not collide with the semver patterns below.
        tags: |
          type=semver,pattern=v{{version}}
          type=semver,pattern=v{{major}}.{{minor}}
          type=ref,event=branch
        # latest=auto would move "latest" on every tag push, rc included,
        # and also on the main-branch tag; only a non-prerelease version
        # tag may move it.
        flavor: |
          latest=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'RC') }}

    - uses: docker/build-push-action@v7
      with:
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ inputs.version }}
