name: 'Lint'
description: 'Check format, module tidiness, vet, and golangci-lint. The Makefile is the source of truth, except for golangci-lint (see below).'

runs:
  using: 'composite'
  steps:
    - name: Check formatting
      shell: bash
      run: make fmt-check

    - name: Check module tidiness
      shell: bash
      run: make tidy-check

    - name: Run go vet
      shell: bash
      run: make vet

    # golangci-lint runs through the official action, not a `make lint` target.
    # @v9 is the major-version tag; the linter version is pinned exactly.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
