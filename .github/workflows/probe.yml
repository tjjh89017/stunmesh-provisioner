# Probe workflow.
#
# This workflow measures what a GitHub-hosted runner can actually do. Later
# OpenWrt VM e2e work depends on KVM acceleration. Guessing that capability
# from local knowledge is not allowed, so this workflow runs the real checks
# on the real runner images and records the evidence in the job summary.
#
# This workflow is operator-triggered only. It burns runner minutes and
# installs qemu, so it must never run on push or pull_request.
#
# The enable-KVM udev rule and the qemu install steps are candidates for
# extraction into `.github/actions/*` once a second workflow needs them.
# They stay inline here because this workflow is exploratory.

name: Probe

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: >-
          OpenWrt release to build, for example 25.12.5. Leave empty to
          resolve the latest stable release automatically.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - name: Report runner identity and capacity
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          {
            echo "## Runner identity and capacity (${MATRIX_OS})"
            echo
            echo '```'
            uname -a
            echo
            cat /etc/os-release
            echo
            echo "nproc: $(nproc)"
            echo
            free -h
            echo
            df -h /
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check CPU virtualization flags
        run: |
          set -euo pipefail
          {
            echo "## CPU virtualization flags"
            echo
            if grep -Eq 'vmx|svm' /proc/cpuinfo; then
              echo "Found: $(grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            else
              echo "NONE FOUND. This runner cannot do hardware virtualization."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check /dev/kvm before any udev rule
        run: |
          set -euo pipefail
          {
            echo "## /dev/kvm before the enable-KVM udev rule"
            echo
            if [ -e /dev/kvm ]; then
              echo '```'
              ls -l /dev/kvm
              stat -c 'owner=%U group=%G mode=%a' /dev/kvm
              echo '```'
            else
              echo "/dev/kvm does not exist yet."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # This is the standard rule GitHub-hosted-runner guides use to make
      # /dev/kvm usable by the unprivileged runner user. It is a candidate
      # for extraction into .github/actions/enable-kvm.
      - name: Install enable-KVM udev rule
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Report /dev/kvm after the udev rule
        run: |
          set -euo pipefail
          {
            echo "## /dev/kvm after the enable-KVM udev rule"
            echo
            if [ ! -e /dev/kvm ]; then
              echo "/dev/kvm STILL DOES NOT EXIST. This runner has no KVM device."
              exit 1
            fi
            echo '```'
            ls -l /dev/kvm
            stat -c 'owner=%U group=%G mode=%a' /dev/kvm
            echo '```'
            echo
            # A readable/writable device file is necessary but not proof
            # that acceleration engages. Record it anyway, since it is the
            # step operators usually stop at, and the point below where
            # that assumption breaks matters.
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "The runner user can open /dev/kvm read-write."
            else
              echo "The runner user CANNOT open /dev/kvm read-write."
              exit 1
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install qemu-system-x86_64
        run: |
          set -euo pipefail
          {
            echo "## qemu install"
            echo
            start_epoch=$(date +%s)
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-system-x86 qemu-utils
            end_epoch=$(date +%s)
            echo "apt install took $(( end_epoch - start_epoch )) seconds."
            echo
            echo '```'
            qemu-system-x86_64 --version
            echo '```'
            echo
            echo "### Accelerators this qemu build lists"
            echo
            echo '```'
            qemu-system-x86_64 -accel help
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Positive proof that KVM acceleration engages.
      #
      # A plain "-accel kvm" run is not proof: QEMU's `-accel` list falls
      # through to the next entry when one fails to init, and a boot with
      # no working display or serial console can exit 0 either way. So
      # this step boots a minimal kernel-less guest under "-accel kvm"
      # (no fallback accelerator listed) with the QEMU monitor wired to
      # stdio, and greps the monitor's own "info kvm" reply for the KVM
      # identity string that only appears when the KVM accelerator
      # actually initialized. If KVM does not engage, QEMU either exits
      # non-zero (no other accelerator to fall back to) or the info
      # string never appears, and the grep -q fails the step either way.
      - name: Prove KVM acceleration actually engages
        run: |
          set -euo pipefail
          {
            echo "## KVM acceleration proof"
            echo
            start_epoch=$(date +%s)

            # -S freezes the vCPU at startup so nothing runs before the
            # monitor asks "info kvm". -monitor stdio exposes the QEMU
            # monitor there, and "info kvm" reports whether the KVM
            # accelerator is in use for this running VM (not just present
            # on the host).
            #
            # This step boots no guest (-kernel is never given), so no
            # serial console is needed. -display none removes the need
            # for a display backend, and -serial none stops QEMU from
            # attaching a default serial device to stdio. That leaves
            # stdio claimed by exactly one character device, the
            # monitor, so QEMU does not refuse to start. Feeding the
            # commands through a pipe and wrapping the whole call in
            # `timeout` rules out a hang: the monitor reads "info kvm"
            # and "quit" from the pipe, "quit" ends QEMU, and stdin EOF
            # after that closes the pipe even if "quit" were dropped.
            output=$(
              printf 'info kvm\nquit\n' | timeout 30 qemu-system-x86_64 \
                -accel kvm \
                -machine pc \
                -cpu host \
                -m 128 \
                -display none \
                -serial none \
                -no-reboot \
                -S \
                -monitor stdio || true
            )

            echo '```'
            echo "$output"
            echo '```'

            end_epoch=$(date +%s)
            echo
            echo "Acceleration proof took $(( end_epoch - start_epoch )) seconds."
            echo

            if echo "$output" | grep -qi 'kvm support: enabled'; then
              echo "KVM acceleration CONFIRMED ENGAGED."
            else
              echo "KVM acceleration DID NOT ENGAGE. Failing the job."
              exit 1
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # This job measures whether the OpenWrt ImageBuilder can produce the
  # image the e2e VM will boot, and what that build costs on a real
  # runner. It resolves the current stable release at run time instead of
  # pinning one, because a hardcoded release goes stale the day OpenWrt
  # ships the next point release. The operator can still force a specific
  # release through the `openwrt_version` input, for example to debug a
  # broken upstream release without editing this file.
  #
  # There is no matrix here. Unlike KVM acceleration, an ImageBuilder
  # build does not depend on the CPU vendor, so one runner is enough
  # evidence.
  probe-imagebuilder:
    name: Probe ImageBuilder
    runs-on: ubuntu-latest
    env:
      OPENWRT_TARGET: x86
      OPENWRT_SUBTARGET: "64"
      OPENWRT_PROFILE: generic
      OPENWRT_PACKAGES: "kmod-wireguard wireguard-tools"
    # The boot/SSH probe job needs the resolved version to name the
    # artifact it downloads, so this job publishes it as a job output
    # rather than making that job resolve the version a second time.
    outputs:
      openwrt_version: ${{ steps.resolve.outputs.version }}
    steps:
      # The releases index lists every release line OpenWrt ever
      # published, release candidates and betas included. A plain
      # "X.Y.Z" directory name (three numeric components, nothing else)
      # is a stable point release; "X.Y.Z-rcN" and similar are not.
      # Sorting the plain names as versions and taking the highest gives
      # the current stable release without hardcoding it anywhere.
      - name: Resolve OpenWrt stable release
        id: resolve
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.openwrt_version }}
        run: |
          set -euo pipefail
          {
            echo "## Resolve OpenWrt stable release"
            echo
            if [ -n "$VERSION_OVERRIDE" ]; then
              version="$VERSION_OVERRIDE"
              echo "Operator override: using OpenWrt ${version}."
            else
              index=$(curl -fsSL https://downloads.openwrt.org/releases/)
              version=$(echo "$index" \
                | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' \
                | sed -E 's/^href="//; s#/"$##' \
                | sort -V \
                | tail -1)
              if [ -z "$version" ]; then
                echo "Found no stable release in the releases index. Failing."
                exit 1
              fi
              echo "Resolved the latest stable release from the releases index."
            fi

            target_dir="https://downloads.openwrt.org/releases/${version}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/"
            if ! curl -fsSL -o /dev/null "$target_dir"; then
              echo "OpenWrt ${version} has no ${OPENWRT_TARGET}/${OPENWRT_SUBTARGET} target directory. Failing."
              exit 1
            fi

            echo "OPENWRT_VERSION=${version}" >> "$GITHUB_ENV"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo
            echo "**Resolved OpenWrt version: ${version}**"
            echo
            echo "Record this value: it names the exact release every other"
            echo "number in this job is measured against."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The download is fresh every run because the resolved version can
      # change between runs. A cache keyed on a moving target would need
      # its key to include the version anyway, and would only ever save
      # the one run that happens to reuse the same release as a prior
      # run. The timings below give the operator the real evidence for
      # revisiting this decision later.
      - name: Download the ImageBuilder and its sha256sums
        run: |
          set -euo pipefail
          {
            echo "## Download"
            echo
            base_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
            ib_file="openwrt-imagebuilder-${OPENWRT_VERSION}-${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}.Linux-x86_64.tar.zst"
            echo "ImageBuilder file: ${ib_file}"

            start_epoch=$(date +%s)
            curl -fsSL -o "$ib_file" "${base_url}/${ib_file}"
            curl -fsSL -o sha256sums "${base_url}/sha256sums"
            end_epoch=$(date +%s)

            ib_size=$(stat -c%s "$ib_file")
            download_seconds=$(( end_epoch - start_epoch ))

            echo "Download took ${download_seconds} seconds."
            echo "ImageBuilder tarball size: ${ib_size} bytes ($(awk "BEGIN{printf \"%.1f\", ${ib_size}/1024/1024}") MiB)."

            {
              echo "IMAGEBUILDER_FILE=${ib_file}"
              echo "IMAGEBUILDER_SIZE=${ib_size}"
              echo "IMAGEBUILDER_DOWNLOAD_SECONDS=${download_seconds}"
            } >> "$GITHUB_ENV"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the ImageBuilder checksum
        run: |
          set -euo pipefail
          {
            echo "## Checksum verification"
            echo
            line=$(grep -F " *${IMAGEBUILDER_FILE}" sha256sums || true)
            if [ -z "$line" ]; then
              echo "No sha256sums entry for ${IMAGEBUILDER_FILE}. Failing."
              exit 1
            fi
            echo "Official entry: ${line}"
            if echo "$line" | sha256sum -c -; then
              echo "Checksum OK."
            else
              echo "CHECKSUM MISMATCH. Failing the job."
              exit 1
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install zstd
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

      - name: Extract the ImageBuilder
        run: |
          set -euo pipefail
          {
            echo "## Extract"
            echo
            start_epoch=$(date +%s)
            mkdir -p imagebuilder
            tar --use-compress-program=unzstd -xf "$IMAGEBUILDER_FILE" -C imagebuilder --strip-components=1
            end_epoch=$(date +%s)
            extract_seconds=$(( end_epoch - start_epoch ))
            echo "Extraction took ${extract_seconds} seconds."
            echo "EXTRACT_SECONDS=${extract_seconds}" >> "$GITHUB_ENV"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ext4-combined, not squashfs-combined-efi: OpenWrt 25.12's
      # squashfs-combined-efi image has reported boot failures
      # (openwrt/openwrt#22313), and ext4 gives the e2e a writable
      # rootfs. "make image" with no image-type filter builds every
      # image format the target defines in one pass, ext4-combined
      # included, so no extra flag selects it; the next step picks the
      # ext4-combined file out of the results.
      #
      # The full build log is not piped into the job summary: OpenWrt's
      # image build emits far more output than the summary's size limit
      # comfortably holds. Only the timing, which is the measurement
      # this job exists to record, goes to the summary. The full log
      # still reaches the job log through the normal step output.
      - name: Build the image with make image
        run: |
          set -euo pipefail
          {
            echo "## make image"
            echo
            echo "Profile: ${OPENWRT_PROFILE}"
            echo "Packages: ${OPENWRT_PACKAGES}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          start_epoch=$(date +%s)
          make -C imagebuilder image PROFILE="${OPENWRT_PROFILE}" PACKAGES="${OPENWRT_PACKAGES}"
          end_epoch=$(date +%s)
          make_image_seconds=$(( end_epoch - start_epoch ))

          echo "MAKE_IMAGE_SECONDS=${make_image_seconds}" >> "$GITHUB_ENV"
          echo "make image took ${make_image_seconds} seconds." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the built image size
        run: |
          set -euo pipefail
          {
            echo "## Image size"
            echo
            image_file="imagebuilder/bin/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}/openwrt-${OPENWRT_VERSION}-${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}-${OPENWRT_PROFILE}-ext4-combined.img.gz"
            if [ ! -f "$image_file" ]; then
              echo "Expected ext4-combined image not found at ${image_file}. Failing."
              exit 1
            fi

            compressed_size=$(stat -c%s "$image_file")
            uncompressed_size=$(gzip -l "$image_file" | awk 'NR==2{print $2}')

            echo "Image: ${image_file}"
            echo "Compressed size: ${compressed_size} bytes ($(awk "BEGIN{printf \"%.1f\", ${compressed_size}/1024/1024}") MiB)."
            echo "Uncompressed size: ${uncompressed_size} bytes ($(awk "BEGIN{printf \"%.1f\", ${uncompressed_size}/1024/1024}") MiB)."

            echo "IMAGE_FILE=${image_file}" >> "$GITHUB_ENV"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report timing summary
        run: |
          set -euo pipefail
          {
            echo "## Timing summary for OpenWrt ${OPENWRT_VERSION}"
            echo
            echo "| Step | Seconds |"
            echo "|---|---|"
            echo "| Download | ${IMAGEBUILDER_DOWNLOAD_SECONDS} |"
            echo "| Extract | ${EXTRACT_SECONDS} |"
            echo "| make image | ${MAKE_IMAGE_SECONDS} |"
            echo
            echo "No cache: this job resolves the stable release fresh on"
            echo "every run, so the ImageBuilder tarball is a moving target"
            echo "and there is no stable key to cache it under. These"
            echo "numbers are the evidence for revisiting that later, not a"
            echo "cache recommendation."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the built image
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-x86-64-generic-ext4-combined
          path: ${{ env.IMAGE_FILE }}
          retention-days: 3
          if-no-files-found: error

  # This job answers the question the previous two jobs cannot: does a
  # real OpenWrt guest boot under KVM and become something
  # stunmesh-agent's uci/ubus/netifd tests could actually drive? It
  # downloads the image the ImageBuilder job already built rather than
  # rebuilding it, because a workflow_dispatch run executes every job in
  # this file anyway, and rebuilding the same image a second time would
  # only add the make-image minutes this workflow already measured once.
  probe-boot-ssh:
    name: Probe boot and SSH
    needs: probe-imagebuilder
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # actions/download-artifact needs read access to this run's own
      # artifacts. The workflow-level `permissions:` block sets every
      # unlisted scope to none, so this job needs its own grant.
      actions: read
    steps:
      # Same rule as the KVM-capability probe job above. Duplicated here
      # instead of shared because each job gets its own fresh runner, so
      # each one starts with /dev/kvm at mode 660. This block and the
      # one in the `probe` job are the same extraction candidate noted
      # at the top of this file.
      - name: Enable /dev/kvm for the runner user
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "/dev/kvm is not read-write for the runner user. Failing." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install qemu-system-x86_64 and helpers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils util-linux
          qemu-system-x86_64 --version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the OpenWrt image built by the ImageBuilder job
        uses: actions/download-artifact@v8
        with:
          name: openwrt-${{ needs.probe-imagebuilder.outputs.openwrt_version }}-x86-64-generic-ext4-combined
          path: image

      - name: Decompress the image
        run: |
          set -euo pipefail
          {
            echo "## Decompress"
            echo
            gz_file=$(find image -maxdepth 1 -name '*.img.gz' | head -1)
            if [ -z "$gz_file" ]; then
              echo "No .img.gz found in the downloaded artifact. Failing."
              exit 1
            fi
            gunzip -c "$gz_file" > openwrt.img
            echo "Decompressed $(basename "$gz_file") to openwrt.img ($(stat -c%s openwrt.img) bytes)."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A stock OpenWrt image ships no /etc/config/network at all: the
      # config that would normally put lan on static 192.168.1.1 is
      # generated by /etc/board.d the first time procd runs, from
      # board-detection logic, not from a file already on the image.
      # QEMU user-mode networking hands out 10.0.2.x by DHCP and cannot
      # reach 192.168.1.1 through a plain hostfwd, and there is no way to
      # SSH in and fix that after boot, because the network is exactly
      # what is broken. So this step loop-mounts the rootfs partition
      # before boot and writes a network config that puts lan on DHCP
      # instead. That lands the guest in QEMU's own 10.0.2.0/24 network,
      # where a plain "hostfwd=tcp::PORT-:22" already reaches it, with no
      # custom subnet needed.
      #
      # Authentication: a stock root account has an empty password, and
      # dropbear's default RootPasswordAuth would let that through, but
      # relying on an empty-password login path is not something to
      # depend on for a CI probe. This step drops an ed25519 public key
      # into /etc/dropbear/authorized_keys instead, so login is by key,
      # deterministically.
      #
      # This same loop-mount technique is how the real e2e will later
      # inject the stunmesh-agent binary and its config onto the image.
      # Proving it works here has value beyond this probe, though no
      # payload is injected yet.
      - name: Loop-mount the rootfs and inject network config plus an SSH key
        run: |
          set -euo pipefail
          {
            echo "## Network and authentication setup"
            echo
            echo "lan switched from the image default (no config at all,"
            echo "which board.d would turn into static 192.168.1.1) to"
            echo "DHCP on eth0, and an ed25519 key installed for root,"
            echo "both by loop-mounting the rootfs partition before boot."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          ssh-keygen -t ed25519 -N "" -f probe_key -q -C "stunmesh-probe"

          loop_dev=$(sudo losetup -fP --show openwrt.img)
          trap 'sudo losetup -d "$loop_dev" 2>/dev/null || true' EXIT

          # The writable rootfs partition is not guaranteed to be the
          # same partition number across OpenWrt releases, so find it by
          # filesystem type instead of hardcoding a partition index.
          rootfs_part=""
          for part in "$loop_dev"p*; do
            if sudo blkid -o value -s TYPE "$part" 2>/dev/null | grep -qx ext4; then
              rootfs_part="$part"
              break
            fi
          done
          if [ -z "$rootfs_part" ]; then
            echo "Found no ext4 partition on openwrt.img. Failing." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          mount_dir=$(mktemp -d)
          sudo mount "$rootfs_part" "$mount_dir"
          trap 'sudo umount "$mount_dir" 2>/dev/null || true; sudo losetup -d "$loop_dev" 2>/dev/null || true' EXIT

          sudo tee "$mount_dir/etc/config/network" >/dev/null <<'NETCONF'
          config interface 'loopback'
          	option device 'lo'
          	option proto 'static'
          	option ipaddr '127.0.0.1'
          	option netmask '255.0.0.0'

          config globals 'globals'
          	option ula_prefix 'fd00::/48'

          config interface 'lan'
          	option device 'eth0'
          	option proto 'dhcp'
          NETCONF

          sudo mkdir -p "$mount_dir/etc/dropbear"
          sudo cp probe_key.pub "$mount_dir/etc/dropbear/authorized_keys"
          sudo chmod 600 "$mount_dir/etc/dropbear/authorized_keys"

          sync
          sudo umount "$mount_dir"
          sudo losetup -d "$loop_dev"
          trap - EXIT

      # Extracted to a script, not inlined twice, because the next two
      # steps run this exact sequence once per candidate NIC. A hung
      # boot never runs past this script's own bound: the outer
      # `timeout` kills QEMU if it has not exited for any reason within
      # BOOT_TIMEOUT_SECONDS, and the SSH wait loop is separately bounded
      # by attempt count, so neither path can run until the job's own
      # 25-minute limit. This script is also a composite-action
      # extraction candidate once a second workflow needs it.
      - name: Write the boot-and-probe script
        run: |
          set -euo pipefail
          cat > boot_and_probe.sh <<'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          nic_device="$1"
          log_file="$2"
          port="$3"

          BOOT_TIMEOUT_SECONDS=180
          SSH_WAIT_ATTEMPTS=90
          SSH_WAIT_INTERVAL_SECONDS=2

          # -display none: no display backend needed for a headless boot.
          # -serial file:LOG: the guest's serial console, captured to a
          #   file so a hung or crashed boot still leaves evidence on
          #   disk for the artifact upload below.
          # -monitor none: no QEMU monitor needed here. Wiring the
          #   monitor to stdio too, the way the KVM-engagement probe
          #   above does, would collide with a default serial-on-stdio
          #   device under -nographic. Neither problem applies here:
          #   -serial already names a file and -monitor is off, so
          #   nothing claims stdio and there is no "multiple character
          #   devices" conflict to avoid.
          timeout "$BOOT_TIMEOUT_SECONDS" qemu-system-x86_64 \
            -accel kvm \
            -machine pc \
            -cpu host \
            -m 256 \
            -smp 2 \
            -drive file=openwrt.img,format=raw,if=virtio \
            -netdev "user,id=net0,hostfwd=tcp::${port}-:22" \
            -device "${nic_device},netdev=net0" \
            -display none \
            -serial "file:${log_file}" \
            -monitor none \
            -no-reboot &
          qemu_pid=$!

          start_epoch=$(date +%s)
          ssh_up=0
          attempt=1
          while [ "$attempt" -le "$SSH_WAIT_ATTEMPTS" ]; do
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU (${nic_device}) exited before SSH came up." >&2
              break
            fi
            if ssh -i probe_key \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=2 \
                -o BatchMode=yes \
                -p "$port" root@127.0.0.1 true 2>/dev/null; then
              ssh_up=1
              break
            fi
            sleep "$SSH_WAIT_INTERVAL_SECONDS"
            attempt=$((attempt + 1))
          done
          end_epoch=$(date +%s)
          boot_seconds=$((end_epoch - start_epoch))

          if [ "$ssh_up" -ne 1 ]; then
            echo "SSH never came up for ${nic_device} within ${SSH_WAIT_ATTEMPTS} attempts." >&2
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            exit 1
          fi

          echo "BOOT_SECONDS=${boot_seconds}"

          # The proof this probe exists for: an SSH session runs real
          # commands inside the guest and returns their output. uci and
          # ubus are the two subsystems stunmesh-agent depends on, so
          # they are the commands worth proving here.
          if ! ssh -i probe_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -p "$port" root@127.0.0.1 \
              'set -e; echo "--- uci show network ---"; uci show network; echo "--- ubus list ---"; ubus list'; then
            echo "A command run over SSH inside the guest (${nic_device}) failed." >&2
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            exit 1
          fi

          ssh -i probe_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -p "$port" root@127.0.0.1 \
            'cat /sys/class/net/eth0/device/uevent 2>/dev/null || echo "DRIVER=unknown"'

          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          SCRIPT_EOF
          chmod +x boot_and_probe.sh

      - name: Boot under virtio-net-pci and prove SSH control
        run: |
          set -euo pipefail
          {
            echo "## Boot proof: -device virtio-net-pci"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if ./boot_and_probe.sh virtio-net-pci boot-virtio-net-pci.log 2222 2>&1 \
              | tee virtio-net-pci.out | tee -a "$GITHUB_STEP_SUMMARY"; then
            boot_result=PASS
          else
            boot_result=FAIL
          fi

          {
            echo '```'
            echo
            boot_seconds=$(grep -oE '^BOOT_SECONDS=[0-9]+' virtio-net-pci.out | tail -1 | cut -d= -f2 || true)
            if [ "$boot_result" = PASS ]; then
              echo "**virtio-net-pci: boot-to-SSH took ${boot_seconds:-unknown} seconds. uci and ubus both ran over SSH.**"
              echo "VIRTIO_BOOT_SECONDS=${boot_seconds:-unknown}" >> "$GITHUB_ENV"
            else
              echo "**virtio-net-pci FAILED: no controllable SSH session within the boot timeout. Failing the job.**"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$boot_result" != PASS ]; then
            exit 1
          fi

      - name: Boot under e1000 and prove SSH control
        run: |
          set -euo pipefail
          {
            echo "## Boot proof: -device e1000"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if ./boot_and_probe.sh e1000 boot-e1000.log 2223 2>&1 \
              | tee e1000.out | tee -a "$GITHUB_STEP_SUMMARY"; then
            boot_result=PASS
          else
            boot_result=FAIL
          fi

          {
            echo '```'
            echo
            boot_seconds=$(grep -oE '^BOOT_SECONDS=[0-9]+' e1000.out | tail -1 | cut -d= -f2 || true)
            if [ "$boot_result" = PASS ]; then
              echo "**e1000: boot-to-SSH took ${boot_seconds:-unknown} seconds. uci and ubus both ran over SSH.**"
              echo "E1000_BOOT_SECONDS=${boot_seconds:-unknown}" >> "$GITHUB_ENV"
            else
              echo "**e1000 FAILED: no controllable SSH session within the boot timeout. Failing the job.**"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$boot_result" != PASS ]; then
            exit 1
          fi

      # Both NICs get proven above so the choice below rests on evidence
      # from this run, not on assumption. The exact command line is
      # recorded verbatim so the e2e item that follows can lift it
      # without re-deriving the flags.
      - name: Record the NIC decision and the QEMU command line
        run: |
          set -euo pipefail
          {
            echo "## NIC decision for the e2e"
            echo
            echo "| NIC | Boot-to-SSH seconds |"
            echo "|---|---|"
            echo "| virtio-net-pci | ${VIRTIO_BOOT_SECONDS:-unknown} |"
            echo "| e1000 | ${E1000_BOOT_SECONDS:-unknown} |"
            echo
            echo "**Use virtio-net-pci for the e2e.** Both NICs booted and"
            echo "answered uci/ubus over SSH on this run, so both are"
            echo "usable, but virtio-net-pci's driver is compiled into the"
            echo "kernel (no kmodloader entry appears for it the way one"
            echo "does for e1000/e1000e/igb), and it is the standard"
            echo "paravirtualized NIC for VM-based testing generally."
            echo
            echo "The exact QEMU command line that worked (port and log"
            echo "file name vary per boot; this is the virtio-net-pci"
            echo "form used above):"
            echo
            echo '```'
            echo "qemu-system-x86_64 \\"
            echo "  -accel kvm \\"
            echo "  -machine pc \\"
            echo "  -cpu host \\"
            echo "  -m 256 \\"
            echo "  -smp 2 \\"
            echo "  -drive file=openwrt.img,format=raw,if=virtio \\"
            echo "  -netdev user,id=net0,hostfwd=tcp::2222-:22 \\"
            echo "  -device virtio-net-pci,netdev=net0 \\"
            echo "  -display none \\"
            echo "  -serial file:boot-virtio-net-pci.log \\"
            echo "  -monitor none \\"
            echo "  -no-reboot"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Uploaded unconditionally: a boot that hangs or fails leaves its
      # only evidence in this log, so the upload must not be skippable
      # by an earlier step's failure. if-no-files-found is "warn" rather
      # than "error" because the very earliest possible failure (before
      # QEMU ever runs) leaves no log file to find, and that case is
      # already reported by the step that failed.
      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-boot-ssh-logs
          path: boot-*.log
          retention-days: 3
          if-no-files-found: warn
