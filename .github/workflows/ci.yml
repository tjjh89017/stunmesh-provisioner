# CI workflow.
#
# This workflow checks format, module tidiness, vet, and unit tests. It then
# builds each release target and uploads the binaries as artifacts.
#
# Steps live in `.github/actions/*`; the Makefile is the source of truth.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check
        uses: ./.github/actions/check

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [agent-mips, agent-mipsle, agent-arm64, build]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build
        uses: ./.github/actions/build
        with:
          target: ${{ matrix.target }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
