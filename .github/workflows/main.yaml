# CI workflow.
#
# This workflow checks format, module tidiness, vet, and unit tests. It then
# builds each release target and uploads the binaries as artifacts, boots a
# real OpenWrt VM under KVM to exercise stunmesh-agent end to end, and runs a
# real round trip against the real Jami dhtproxy instances.
#
# Steps live in `.github/actions/*`; the Makefile is the source of truth.
#
# Chain: lint & test -> build (matrix) -> build-required -> e2e -> e2e-realnet ->
# E2E (e2e-required below, the single check branch protection names).
# A required check that only runs on manual dispatch never blocks a merge.

name: CI

# The push trigger names main only: a tag push must not re-run CI,
# because release.yml's contract is that the tagged commit already went
# through this chain on its way to main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Lint
        uses: ./.github/actions/lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Test
        uses: ./.github/actions/test

  build:
    name: Build (${{ matrix.target }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    # fail-fast: false means one target failing does not cancel the
    # others, so build-required below sees a real "failure" from a
    # broken target instead of a "cancelled" from its siblings.
    strategy:
      fail-fast: false
      matrix:
        target: [agent-mips, agent-mipsle, agent-arm64, build]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build
        uses: ./.github/actions/build
        with:
          target: ${{ matrix.target }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # The single check e2e depends on, instead of the build matrix
  # directly. A matrix "needs:" expands to a dependency on every leg
  # anyway, so pointing e2e at one aggregate name here is both cheaper
  # to read and stable if the matrix gains or loses a target later. It
  # must be red whenever any build leg failed, was cancelled, or was
  # skipped -- a skipped dependency must not read as success, which is
  # why this checks for the exact string "success" rather than the
  # absence of "failure".
  build-required:
    name: Build
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every build target succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "build job result: ${BUILD_RESULT}" >&2
            exit 1
          fi

  e2e:
    name: E2E (OpenWrt)
    # e2e builds its own agent/provd/fakeproxy binaries inside run.sh, so
    # it does not need the build matrix's own output -- it needs
    # build-required only so a real device build breaking (not just a
    # unit test) stops a 20-minute VM boot before it starts.
    needs: build-required
    # ubuntu-latest is an x86_64 runner. Nested virtualisation is not
    # available on the arm64 hosted runners, so this must not move to
    # one of those.
    runs-on: ubuntu-latest
    # Measured run.sh alone at 4m20s, plus an ImageBuilder download and
    # build (~95s) and apt installs. 20 minutes leaves real headroom for
    # runner variance without letting a hung boot burn a full hour.
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The harness builds stunmesh-agent, stunmesh-provd, and the fake
      # dhtproxy itself (test/e2e/openwrt/lib.sh, via make and go build).
      # Without this step those builds fall back to whatever Go the
      # runner image ships, which can silently differ from the toolchain
      # build used to produce the release binaries. Pin it explicitly,
      # the same way build and e2e-realnet do.
      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run the OpenWrt e2e harness
        uses: ./.github/actions/e2e-openwrt

  e2e-realnet:
    name: E2E (realnet)
    # Runs beside the OpenWrt leg, not after it. The two answer
    # different questions -- one asks what the agent does to a device,
    # the other asks what the Jami proxies actually return -- and
    # neither needs the other's result. Running them together costs no
    # extra runner minutes and saves the wall-clock of a serial chain.
    needs: build-required
    runs-on: ubuntu-latest
    # Measured locally: build (~20s) + preflight + the publish/fetch
    # round trip + the value-size probe, whose rejected end can take the
    # real proxy up to ~50s to answer (a slow 502, not a fast 4xx).
    # 10 minutes leaves real headroom without letting a hung request
    # burn the job for the better part of an hour.
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run the realnet e2e leg
        uses: ./.github/actions/e2e-realnet

  # The single check a branch protection rule will name, hence the short
  # display name below. Gates on both e2e jobs, the fake proxy and the
  # real Jami proxies.
  #
  # Must be red whenever either e2e job failed, was cancelled, or was
  # skipped -- a skipped dependency must not read as success, which is
  # why this checks for the exact string "success" on each, rather than
  # the absence of "failure".
  e2e-required:
    name: E2E
    needs: [e2e, e2e-realnet]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every e2e job succeeded
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_REALNET_RESULT: ${{ needs.e2e-realnet.result }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "$E2E_RESULT" != "success" ]]; then
            echo "e2e job result: ${E2E_RESULT}" >&2
            failed=1
          fi
          if [[ "$E2E_REALNET_RESULT" != "success" ]]; then
            echo "e2e-realnet job result: ${E2E_REALNET_RESULT}" >&2
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

  # Never gates a merge: no job depends on this one.
  # Skips pull requests; a PR has no packages:write token to publish with.
  docker:
    name: Docker image
    needs: e2e-required
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the image, and publish it on a push to main
        uses: ./.github/actions/docker
        with:
          version: ${{ github.ref_name }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          platforms: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
