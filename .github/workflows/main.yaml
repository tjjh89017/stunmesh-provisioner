# CI workflow.
#
# This workflow checks format, module tidiness, vet, and unit tests. It then
# builds each release target and uploads the binaries as artifacts, and boots
# a real OpenWrt VM under KVM to exercise stunmesh-agent end to end.
#
# Steps live in `.github/actions/*`; the Makefile is the source of truth.
#
# e2e runs on every push and pull_request, not workflow_dispatch-only like
# probe.yml. probe.yml is exploratory and only ever burns minutes on demand;
# e2e-required below is meant to become a branch protection check, and a
# required check that only runs on manual dispatch never blocks a merge.
# That trade costs real runner minutes on every push, but it is the one this
# job exists to make.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check
        uses: ./.github/actions/check

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [agent-mips, agent-mipsle, agent-arm64, build]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build
        uses: ./.github/actions/build
        with:
          target: ${{ matrix.target }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: E2E (OpenWrt)
    # Only check, not build. e2e builds its own agent/provd/fakeproxy
    # binaries inside run.sh, so it does not need the build matrix's
    # output. It does need check: there is no reason to boot a VM for
    # 5+ minutes when gofmt, go vet or a unit test already failed.
    needs: check
    # ubuntu-latest is an x86_64 runner. Nested virtualisation is not
    # available on the arm64 hosted runners, so this must not move to
    # one of those.
    runs-on: ubuntu-latest
    # Measured run.sh alone at 4m20s, plus an ImageBuilder download and
    # build (~95s) and apt installs. 20 minutes leaves real headroom for
    # runner variance without letting a hung boot burn a full hour.
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run the OpenWrt e2e harness
        uses: ./.github/actions/e2e-openwrt

  # The single check a branch protection rule will name. It must be red
  # whenever any e2e job failed, was cancelled, or was skipped -- a
  # skipped dependency must not read as success, which is why this does
  # not just check for the absence of "failure".
  e2e-required:
    name: E2E required
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every e2e job succeeded
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          if [[ "$E2E_RESULT" != "success" ]]; then
            echo "e2e job result: ${E2E_RESULT}" >&2
            exit 1
          fi
